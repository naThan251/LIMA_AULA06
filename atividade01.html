<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>

    <style>
        body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .header, .footer {
            width: 100%;
            height: 50px;
            background-color: indianred; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .box {
            background-color: coral;
            width: 200px;
            padding: 10px;
            box-sizing: border-box;
        }

        .box.principal {
            background-color: antiquewhite; 
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="header">Header</div>
    <div class="main">
        <div class="box">Menu Lateral</div>
        <div class="box principal">Conteúdo principal</div>
        <div class="box">Lateral Direita</div>
    </div>
    <div class="footer">Rodapé</div>
</body>
</html>
