<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f0f0;
        }

        header {
            background-color:midnightblue;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        header h1 {
            font-size: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .banner {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 30px 20px;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            width: 200px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .card-content {
            padding: 10px;
        }

        .card-content h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }

        .card-content p {
            font-size: 12px;
            color: #777;
        }

        footer {
            background-color:darkblue;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Viagens</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Pacotes</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <img class="banner" src="main.jpg" alt="Banner Principal">

    <div class="cards-container">
        <div class="card">
            <img src="brasil.jpg" alt="Brasil">
            <div class="card-content">
                <h3>Brasil</h3>
                <p>R$ 5.000</p>
            </div>
        </div>

        <div class="card">
            <img src="franca.jpg" alt="França">
            <div class="card-content">
                <h3>França</h3>
                <p>R$ 15.000</p>
            </div>
        </div>

        <div class="card">
            <img src="italia.jpg" alt="Itália">
            <div class="card-content">
                <h3>Itália</h3>
                <p>R$ 15.000</p>
            </div>
        </div>

        <div class="card">
            <img src="alemanha.jpg" alt="Suiça">
            <div class="card-content">
                <h3>Alemanha</h3>
                <p>R$ 15.000</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Trips - Todos os direitos reservados</p>
    </footer>

</body>
</html>
